  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link rel="stylesheet" href="style.css" />

<body>

  <!-- Skip link for accessibility -->

  <!-- ===== Header ===== -->
  <header class="header" role="banner">
    <div class="container header__inner">
      <div class="brand">
		<div class="brand__logo" aria-hidden="true">
  <!-- Cactus SVG logo from IMG_7514.svg -->
  <svg viewBox="0 0 200 200" width="34" height="34" fill="none" xmlns="http://www.w3.org/2000/svg">

</div>

        <div class="brand__text">
          <h1 class="brand__name">کاکتوس</h1>
          <span class="brand__tagline">CACTUS DINER</span>

        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

        <span>تماس</span>

    </div>
  </header>

  <!-- ===== Hero ===== -->
  <section class="hero" aria-label="معرفی">
    <div class="container">
      <h2 class="hero__title">طعمی که به یاد می‌ماند</h2>
      <p class="hero__subtitle">منوی کامل کاکتوس را ببینید و سفارش دهید</p>
    </div>
  </section>

  <!-- ===== Controls (search + filter) ===== -->
  <div class="controls" role="search">
    <div class="container">
      <div class="search">
        <svg class="search__icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8" />
          <path d="m21 21-4.3-4.3" />
        </svg>
        <input
          type="search"
          id="searchInput"
          class="search__input"
          placeholder="جستجوی غذا..."
          aria-label="جستجوی غذا"
          autocomplete="off"
        />
      </div>

      <nav class="filters" id="filters" aria-label="دسته‌بندی‌ها">
        <!-- category buttons injected by JS -->
      </nav>
    </div>
  </div>

  <!-- ===== Menu ===== -->
  <main class="container">
    <section id="menu" aria-label="منوی غذا">
      <div class="menu-grid" id="menuGrid" aria-live="polite">
        <!-- cards injected by JS -->
      </div>

      <!-- Empty / loading / error states -->
      <div class="state" id="stateBox" hidden>
        <p id="stateText"></p>
      </div>
    </section>
  </main>

  <!-- ===== Footer ===== -->
  <footer class="footer" role="contentinfo">
    <div class="container footer__inner">
      <div class="footer__brand">
        <h3>کاکتوس</h3>
        <p class="footer__addr">خیابان گلستان، گلستان ۱۲</p>
      </div>

      <div class="footer__actions">
        <a href="tel:+985155196322" class="fbtn" aria-label="تماس تلفنی">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>

          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>

    </div>

  <!-- Back to top -->
  <button id="backToTop" class="back-to-top" aria-label="بازگشت به بالا" hidden>
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 15-6-6-6 6"/></svg>
