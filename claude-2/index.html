<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ===== SEO پایه ===== -->
  <title>کاکتوس | منوی دیجیتال فست‌فود</title>
  <meta name="description" content="منوی دیجیتال فست‌فود کاکتوس؛ برگر، ساندویچ، پیتزا و نوشیدنی با کیفیت عالی. مشاهده منو، تماس و مسیریابی." />
  <meta name="theme-color" content="#0d0d0d" />
  <meta name="author" content="Cactus Diner" />

  <!-- Open Graph برای اشتراک‌گذاری در شبکه‌های اجتماعی -->
  <meta property="og:title" content="کاکتوس | منوی دیجیتال" />
  <meta property="og:description" content="منوی دیجیتال فست‌فود کاکتوس" />
  <meta property="og:type" content="website" />

  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌵</text></svg>" />
</head>

<body>
  <!-- ===== هدر برند ===== -->
  <header class="site-header" role="banner">
    <div class="container header-inner">
      <div class="brand">
        <img src="logo.svg" class="brand-logo" alt="لوگوی کاکتوس" width="80" height="44">
        <div class="brand-text">
          <h1 class="brand-name">کاکتوس</h1>
          <span class="brand-tagline">فست‌فود و ساندویچ</span>
        </div>
      </div>

      <!-- دکمه‌های ارتباطی سریع در هدر -->
      <nav class="header-actions" aria-label="ارتباط سریع">
        <a class="icon-btn" href="tel:+985155196322" aria-label="تماس تلفنی" title="تماس">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.5.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.5.1.4 0 .8-.3 1L6.6 10.8z"/></svg>
        </a>
      </nav>
    </div>
  </header>

  <!-- ===== نوار جستجو و فیلتر (چسبان) ===== -->
  <section class="toolbar" aria-label="جستجو و فیلتر منو">
    <div class="container">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 21l-4.3-4.3M11 18a7 7 0 100-14 7 7 0 000 14z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input
          type="search"
          id="searchInput"
          class="search-input"
          placeholder="جستجوی غذا..."
          aria-label="جستجوی غذا"
          autocomplete="off"
        />
      </div>

      <!-- دکمه‌های دسته‌بندی به‌صورت پویا ساخته می‌شوند -->
      <div class="filters" id="filters" role="tablist" aria-label="دسته‌بندی‌ها"></div>
    </div>
  </section>

  <!-- ===== محتوای اصلی منو ===== -->
  <main class="container" role="main">
    <!-- وضعیت بارگذاری -->
    <div id="loader" class="state-msg" aria-live="polite">در حال بارگذاری منو...</div>

    <!-- شبکه کارت‌های غذا -->
    <section id="menuGrid" class="menu-grid" aria-label="لیست غذاها"></section>

    <!-- پیام خالی بودن نتایج -->
    <div id="emptyState" class="state-msg hidden">موردی یافت نشد.</div>
  </main>

  <!-- ===== فوتر با اطلاعات تماس ===== -->
  <footer class="site-footer" role="contentinfo">
    <div class="container footer-inner">
      <div class="footer-brand">
        <img src="logo.svg" class="brand-logo" alt="لوگوی کاکتوس" width="80" height="44" />
        <strong>کاکتوس</strong>
      </div>

      <address class="footer-info">
        <p>📍 خیابان گلستان، گلستان ۱۲</p>
        <p>📞 <a href="tel:+985155196322" dir="ltr">+98 515 519 6322</a></p>
      </address>

      <!-- دکمه‌های اصلی اکشن -->
      <div class="footer-actions">
        <a class="action-btn call" href="tel:+985155196322">
          <span aria-hidden="true">📞</span> تماس
        </a>
        <a class="action-btn route" href="https://maps.app.goo.gl/5HXRu2B72ib9f3aPA?g_st=ic" target="_blank" rel="noopener noreferrer">
          <span aria-hidden="true">🧭</span> مسیریابی
        </a>
        <a class="action-btn insta" href="https://www.instagram.com/cactus.diner?igsh=Zm91Y2llcGpneXls" target="_blank" rel="noopener noreferrer">
          <span aria-hidden="true">📸</span> اینستاگرام
        </a>
      </div>

      <p class="copyright">© کاکتوس — تمامی حقوق محفوظ است.</p>
    </div>
  </footer>

  <!-- دکمه بازگشت به بالا -->
  <button id="backToTop" class="back-to-top" aria-label="بازگشت به بالا" title="بازگشت به بالا">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5l-7 7h4v7h6v-7h4z"/></svg>
  </button>

  <script src="app.js"></script>
</body>
</html>
