<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ===== SEO پایه ===== -->
  <title>منوی دیجیتال | فست‌فود کاکتوس</title>
  <meta name="description" content="منوی آنلاین فست‌فود کاکتوس؛ پیتزا، برگر، ساندویچ، سوخاری، پیش‌غذا و نوشیدنی با قیمت روز." />
  <!-- به‌جای theme-color قبلی -->
<meta name="theme-color" content="#C1121F" />

<!-- favicon با لوگو -->
<link rel="icon" type="image/png" href="assets\IMG_7480.svg" />
<link rel="apple-touch-icon" href="assets\IMG_7480.svg" />

  <!-- ===== Open Graph (اشتراک در شبکه‌های اجتماعی) ===== -->
  <meta property="og:title" content="منوی دیجیتال فست‌فود کاکتوس" />
  <meta property="og:description" content="منوی آنلاین با قیمت روز" />
  <meta property="og:type" content="website" />

  <!-- فونت فارسی وزیرمتن از CDN -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link
    href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <!-- پرش سریع برای کاربران کیبورد/اسکرین‌ریدر (Accessibility) -->

  <!-- صفحه لودینگ -->
<div class="loader" id="loader" aria-hidden="true">
  <img class="loader__logo" src="assets/logo.png" alt="" />
  <div class="loader__bar"></div>
</div>


  <a href="#menu" class="skip-link">پرش به منو</a>

  <!-- ===== هدر ===== -->
  <header class="header" role="banner">
    <div class="header__inner">
      <div class="brand">
        <img class="brand__logo" src="assets/logo.png" alt="لوگوی کاکتوس" width="52" height="52" />

        <div>
          <h1 class="brand__name">فست‌فود کاکتوس</h1>
          <p class="brand__tagline">تازه، داغ و خوشمزه</p>
        </div>
      </div>

      <!-- جستجوی زنده -->
      <div class="search">
        <input
          type="search"
          id="searchInput"
          class="search__input"
          placeholder="جستجوی غذا..."
          aria-label="جستجوی غذا"
          autocomplete="off"
        />
        <span class="search__icon" aria-hidden="true">🔍</span>
      </div>
    </div>

    <!-- فیلتر دسته‌بندی (به‌صورت داینامیک پر می‌شود) -->
    <nav class="categories" id="categories" aria-label="دسته‌بندی غذاها"></nav>
  </header>

  <!-- ===== محتوای اصلی ===== -->
  <main class="container" role="main">
    <!-- شمارنده نتایج -->
    <p class="result-count" id="resultCount" aria-live="polite"></p>

    <!-- شبکه کارت‌ها -->
    <section id="menu" class="menu-grid" aria-label="لیست غذاها"></section>

    <!-- حالت خالی / بدون نتیجه -->
    <div class="empty-state" id="emptyState" hidden>
      <p class="empty-state__emoji">🍽️</p>
      <p>موردی پیدا نشد. عبارت دیگری را امتحان کنید.</p>
    </div>

    <!-- حالت خطای بارگذاری -->
    <div class="error-state" id="errorState" hidden>
      <p class="empty-state__emoji">⚠️</p>
      <p>خطا در بارگذاری منو. لطفاً صفحه را رفرش کنید.</p>
    </div>
  </main>

  <!-- ===== فوتر ===== -->
  <footer class="footer" role="contentinfo">
    <p class="footer__hours" id="footerHours"></p>
    <p class="footer__copy">©منوی آنلاین فست‌فود کاکتوس — همه حقوق محفوظ است</p>
    <p class="footer__createdBy">Created By : Amirhosein-Sajjadi</p>
  </footer>

  <!-- ===== نوار اکشن شناور (تماس / مسیریابی / اینستاگرام) ===== -->
  <div class="action-bar" id="actionBar" role="navigation" aria-label="راه‌های ارتباطی">
    <a href="#" class="action-bar__btn" id="callBtn" aria-label="تماس">
      <span aria-hidden="true">📞</span><span>تماس</span>
    </a>
    <a href="#" class="action-bar__btn" id="mapBtn" target="_blank" rel="noopener" aria-label="مسیریابی">
      <span aria-hidden="true">📍</span><span>مسیر</span>
    </a>
    <a href="#" class="action-bar__btn" id="instaBtn" target="_blank" rel="noopener" aria-label="اینستاگرام">
      <span aria-hidden="true">📷</span><span>اینستاگرام</span>
    </a>
  </div>

  <!-- دکمه بازگشت به بالا -->
  <button id="backToTop" class="back-to-top" aria-label="بازگشت به بالا" hidden>↑</button>

  <script src="script.js"></script>
</body>
</html>
