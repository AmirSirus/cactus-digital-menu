<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منوی دیجیتال فست‌فود</title>
    <meta name="description" content="منوی دیجیتال فست‌فود - سفارش آنلاین و مشاهده قیمت‌ها">
    
    <!-- Fonts -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Section -->
    <header class="header">
        <div class="header-container">
            <h1 class="logo">فست‌فود <span>کاکتوس</span><img src="assets\logo.png" alt="logo-cactus"><span></span></h1>
            
            <div class="search-bar">
                <i class="fa-solid fa-search"></i>
                <input type="text" id="searchInput" placeholder="جستجوی غذا، نوشیدنی..." aria-label="جستجو در منو">
            </div>
        </div>

        <!-- Categories -->
        <nav class="categories-nav">
            <ul class="categories-list" id="categoryList">
                <li><button class="cat-btn active" data-filter="all">همه</button></li>
                <li><button class="cat-btn" data-filter="pizza">پیتزا</button></li>
                <li><button class="cat-btn" data-filter="burger">برگر</button></li>
                <li><button class="cat-btn" data-filter="sandwich">ساندویچ</button></li>
                <li><button class="cat-btn" data-filter="fried">سوخاری</button></li>
                <li><button class="cat-btn" data-filter="appetizer">پیش‌غذا</button></li>
                <li><button class="cat-btn" data-filter="drink">نوشیدنی</button></li>
                <li><button class="cat-btn" data-filter="addon">سس و افزودنی</button></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="results-info">
            <p>نمایش <span id="resultsCount">0</span> آیتم</p>
        </div>
        
        <div class="menu-grid" id="menuGrid">
            <!-- Cards will be injected here via JS -->
            <div class="loader">در حال بارگذاری منو...</div>
        </div>
    </main>

    <!-- Floating Action Buttons -->
    <div class="fab-container">
        <a href="tel:+982100000000" class="fab call" aria-label="تماس با ما">
            <i class="fa-solid fa-phone"></i>
        </a>
        <a href="https://maps.google.com" target="_blank" class="fab map" aria-label="مسیریابی">
            <i class="fa-solid fa-location-dot"></i>
        </a>
        <a href="https://instagram.com" target="_blank" class="fab insta" aria-label="اینستاگرام">
            <i class="fa-brands fa-instagram"></i>
        </a>
        <button class="fab up" id="backToTop" aria-label="بازگشت به بالا">
            <i class="fa-solid fa-chevron-up"></i>
        </button>
    </div>

    <!-- Scripts -->
    <script src="script.js"></script>
</body>
</html>
